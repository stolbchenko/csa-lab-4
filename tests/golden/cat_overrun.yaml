name: cat_overrun
description: Физическое поведение прерываний — три ввода подряд на тактах 100/101/102 (overrun), echo последнего.
source_file: "programs/cat.lisp"
input_file: "input/cat_overrun.txt"
max_ticks: 10000
out_lst: |
  [.text]
  0x0000 - 40000000 00000010 - JMP 0x0010
  0x0002 - 00000E00          - NOP
  0x0010 - 11400000 00000F00 - LOAD SP, #3840
  0x0012 - 11000000 00000000 - LOAD R0, #0
  0x0014 - 12000000 00000400 - STORE [0x0400], R0
  0x0016 - 70000000          - EI
  0x0017 - 11000000 00000000 - LOAD R0, #0
  0x0019 - 11000000 00000000 - LOAD R0, #0
  0x001B - 12000000 00000500 - STORE [0x0500], R0
  0x001D - 10000000 00000400 - LOAD R0, [0x0400]
  0x001F - 27000000 00000500 - CMP R0, [0x0500]
  0x0021 - 41000000 00000027 - JZ 0x0027
  0x0023 - 11000000 00000000 - LOAD R0, #0
  0x0025 - 40000000 00000029 - JMP 0x0029
  0x0027 - 11000000 00000001 - LOAD R0, #1
  0x0029 - 28000000 00000000 - CMP R0, #0
  0x002B - 41000000 00000031 - JZ 0x0031
  0x002D - 11000000 00000000 - LOAD R0, #0
  0x002F - 40000000 00000019 - JMP 0x0019
  0x0031 - 71000000          - DI
  0x0032 - 01000000          - HALT
  0x0E00 - 60000000 00000000 - IN  port=0x00
  0x0E02 - 12000000 00000401 - STORE [0x0401], R0
  0x0E04 - 11000000 00000058 - LOAD R0, #88
  0x0E06 - 12000000 00000580 - STORE [0x0580], R0
out_output: |-
  C

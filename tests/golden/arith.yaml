name: arith
description: Арифметические выражения и CISC-операции регистр-память.
source_file: "programs/arith.lisp"
max_ticks: 10000
trace_mode: "brief"
out_lst: |
  [.text]
  0x0000 - 40000000 00000010 - JMP 0x0010
  0x0010 - 11400000 00000F00 - LOAD SP, #3840
  0x0012 - 11000000 0000000A - LOAD R0, #10
  0x0014 - 12000000 00000400 - STORE [0x0400], R0
  0x0016 - 11000000 00000014 - LOAD R0, #20
  0x0018 - 12000000 00000401 - STORE [0x0401], R0
  0x001A - 11000000 00000003 - LOAD R0, #3
  0x001C - 12000000 00000500 - STORE [0x0500], R0
  0x001E - 10000000 00000401 - LOAD R0, [0x0401]
  0x0020 - 24000000 00000500 - MUL R0, [0x0500]
  0x0022 - 12000000 00000500 - STORE [0x0500], R0
  0x0024 - 10000000 00000400 - LOAD R0, [0x0400]
  0x0026 - 20000000 00000500 - ADD R0, [0x0500]
  0x0028 - 12000000 00000402 - STORE [0x0402], R0
  0x002A - 10000000 00000402 - LOAD R0, [0x0402]
  0x002C - 50000000 0000007E - CALL 0x007E
  0x002E - 10000000 00000600 - LOAD R0, [0x0600]
  0x0030 - 30000000          - PUSH R0
  0x0031 - 11000000 00000000 - LOAD R0, #0
  0x0033 - 12000000 00000600 - STORE [0x0600], R0
  0x0035 - 50000000 0000003F - CALL 0x003F
  0x0037 - 12000000 00000500 - STORE [0x0500], R0
  0x0039 - 31000000          - POP R0
  0x003A - 12000000 00000600 - STORE [0x0600], R0
  0x003C - 10000000 00000500 - LOAD R0, [0x0500]

  [.data]
  0x0000 - 00000001
  0x0001 - 0000000A
out_output: |
  70

  0x0012 - 11000000 00000001 - LOAD R0, #1
  0x0014 - 12000000 00000400 - STORE [0x0400], R0
  0x0016 - 11000000 FFFFFFFE - LOAD R0, #-2
  0x0018 - 12000000 00000401 - STORE [0x0401], R0
